<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jordan 1 Low Fragment - Vellora</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8f8f8;
    }
    header {
      background: #111;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    .container {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      max-width: 300px;
      border-radius: 8px;
    }
    .price {
      font-size: 1.5rem;
      margin-top: 1rem;
    }
    .old-price {
      text-decoration: line-through;
      color: gray;
      margin-left: 0.5rem;
    }
    .description {
      margin-top: 1rem;
      font-size: 1rem;
      text-align: center;
      max-width: 500px;
    }
    .add-btn {
      margin-top: 2rem;
      padding: 0.75rem 1.5rem;
      background: #0070ba;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    .add-btn:hover {
      background: #005c99;
    }
  </style>
</head>
<body>
  <header>
    <h1>Jordan 1 Low Fragment</h1>
  </header>
  <div class="container">
    <img src="img/jordan1.jpg" alt="Jordan 1 Low Fragment">
    <div class="price">
      74,99 zł <span class="old-price">149,99 zł</span>
    </div>
    <p class="description">
      Jordan 1 Low Fragment to klasyczny model w stylu retro z nowoczesnym akcentem. Wysoka jakość materiałów i wyjątkowy wygląd zapewnią Ci styl i komfort każdego dnia.
    </p>
    <button class="add-btn" onclick="addToCart('Jordan 1 Low Fragment', 74.99)">Dodaj do koszyka</button>
  </div>
  <script>
    function addToCart(name, price) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push({ name, price });
      localStorage.setItem('cart', JSON.stringify(cart));
      alert('Dodano do koszyka!');
    }
  </script>
</body>
</html>
